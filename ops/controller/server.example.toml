public_base_url = "https://subscription.example.invalid"
allowed_origins = ["https://admin.example.invalid"]
control_db = "/data/control/control.db"
traffic_db = "/data/traffic/traffic.db"
traffic_snapshot = "/data/telemetry/traffic.json"
public_dir = "/data/publication/subscriptions"
inventory_file = "/data/inventory/nodes.json"
key_file = "/run/secrets/master.key"
ssh_dir = "/run/secrets/ssh"
web_dir = "/opt/sbctl/web"
secure_cookie = true
session_seconds = 28800
max_users = 100
stale_seconds = 180
sync_seconds = 15
# 主控位于反代之后时，填写反代到达 API 的来源地址或网段，登录限流才能区分真实客户端。
# 仅在反代会追加 X-Forwarded-For 时启用，例如 nginx：
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# trusted_proxies = ["172.18.0.1"]
